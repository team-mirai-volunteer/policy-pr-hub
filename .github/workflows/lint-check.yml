# .github/workflows/lint-check.yml
name: Lint Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # 手動実行も可能にする


jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # このワークフローは、プロジェクトの言語やフレームワークに合わせてカスタマイズしてください
      # 以下は一般的な例です

      # Pythonプロジェクトの場合
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Run lint
        run: ruff check .

      # JavaScriptプロジェクトの場合
      # - name: Set up Node.js
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: '20'
      #     cache: 'npm'
      #
      # - name: Install dependencies
      #   run: npm ci
      #
      # - name: Run lint
      #   run: npm run lint

      # webappディレクトリのNode.jsプロジェクトもチェック
      - name: Set up Node.js for webapp
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'webapp/package-lock.json'

      - name: Install webapp dependencies
        run: |
          cd webapp
          npm ci

      - name: Run webapp lint
        run: |
          cd webapp
          npm run lint
